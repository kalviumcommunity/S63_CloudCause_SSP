name: CostTrace Data Pipeline Automation

on:
  schedule:
    # Run pipeline daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-pipeline-automation:
    name: Execute Pipeline & Validate Attribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify raw data files exist
        run: |
          echo "Checking raw data files..."
          ls -la data/raw/
          test -f data/raw/billing_data.csv || (echo "Missing billing_data.csv" && exit 1)
          test -f data/raw/deployment_events.json || (echo "Missing deployment_events.json" && exit 1)
          test -f data/raw/usage_metrics.csv || (echo "Missing usage_metrics.csv" && exit 1)
          echo "All raw datasets present."

      - name: Run data validation tests
        run: |
          echo "Executing test suite..."
          python -m pytest tests/ -v --tb=short
        env:
          CI: "true"

      - name: Execute CostTrace CLI Pipeline
        run: |
          echo "Executing CostTrace end-to-end pipeline..."
          python scripts/run_pipeline.py
        env:
          CI: "true"

      - name: Verify pipeline outputs
        run: |
          echo "Verifying generated database and outputs..."
          test -f data/costtrace.db || (echo "FAIL: SQLite DB not created" && exit 1)
          test -f output/spike_attribution_summary.csv || (echo "FAIL: Summary CSV missing" && exit 1)
          test -f data/processed/billing_cleaned.csv || (echo "FAIL: billing_cleaned.csv missing" && exit 1)
          test -f data/processed/deployments_cleaned.csv || (echo "FAIL: deployments_cleaned.csv missing" && exit 1)
          test -f data/processed/usage_cleaned.csv || (echo "FAIL: usage_cleaned.csv missing" && exit 1)
          echo "All pipeline outputs validated successfully."

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: costtrace-attribution-output
          path: |
            output/
            data/costtrace.db
